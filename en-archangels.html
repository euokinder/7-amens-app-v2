<!doctype html>
<html lang="en" class="member-checking">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Four Archangels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/en/app.css">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/icon-32.png">
<link rel="apple-touch-icon" href="/assets/images/icon-180.png">
</head>
<body>
<!-- App em inglês (EUA): The Four Archangels (a Central dos 4 Arcanjos). CÓPIA do
     es-arcangeles.html (que copia o arcanjos.html do Brasil), em inglês. Quem não
     comprou vê o convite para conhecer (js/en/extras.js). Conteúdo:
     js/en/arcangeles.js. Plano: docs/app-en.md -->
<div id="member-gate" role="status">
  <p>Checking your access…</p>
  <noscript><p>Your browser has JavaScript turned off. Please turn it on to open your prayers.</p></noscript>
  <a class="member-gate-help" id="ayuda-portao" href="#">Need help? Contact us</a>
</div>
<div class="app">

  <div class="header">
    <button class="back-btn" id="volver" onclick="history.length > 1 ? history.back() : location.href='/en'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      <span>Back</span>
    </button>
    <div class="avatar"><img src="/assets/images/icon-96.png" alt="7 Amens Before Dawn" width="44" height="44"></div>
  </div>

  <div class="content">

    <div class="section-heading">
      <div class="bar"></div>
      <div class="heading-block">
        <h1 class="title" style="font-size:24px;">The Four Archangels</h1>
        <p class="subtext">Tap an archangel to see his three prayers.</p>
      </div>
    </div>

    <div id="arcangeles-lista" style="display:flex;flex-direction:column;gap:20px;"></div>

    <!-- Bonus material: o PDF dos Arcanjos em inglês (só os três que a Igreja nomeia, como no espanhol). -->
    <h2 class="section-label">Bonus material</h2>

    <a href="/assets/en/pdf/prayers-to-the-holy-archangels.pdf" target="_blank" rel="noopener" class="card static" style="height:280px;background-image:linear-gradient(to top, oklch(0.06 0.01 40 / 0.35) 0%, transparent 45%), url(/assets/images/home/arcanjos.jpg);">
      <div class="play-btn">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--dark-on-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg>
      </div>
      <div class="card-body">
        <h3 class="card-title">Prayers to the Holy Archangels</h3>
        <p class="card-sub">A PDF with Saint Michael, Saint Gabriel, and Saint Raphael, to save or print</p>
      </div>
    </a>

  </div>
</div>

<script src="/js/en/config.js"></script>
<script src="/js/en/sesion.js"></script>
<script src="/js/en/oferta.js"></script>
<script src="/js/en/arcangeles.js"></script>
<script src="/js/en/extras.js"></script>
<script src="/js/en/app.js"></script>
<script src="/js/en/arcangeles-lista.js"></script>
</body>
</html>
