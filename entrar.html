<!--
  O LINK DE ENTRADA (24/09/2026). A cliente chega aqui pelo link que o
  suporte manda no WhatsApp: setemadrugadas.com.br/entrar#<código>.
  Quem faz o trabalho é o js/member.js (entrarPeloLink): lê o código, abre a
  sessão e leva para a home. Esta página só aparece de verdade se der errado.

  O que o WhatsApp mostra no cartão do link sai destas três linhas. O
  "Toque para entrar" é a instrução, para quem não sabe que link se toca.
-->

  .entrar-saidas[hidden], .entrar-saidas [hidden] { display: none; }
  /* O link com cara de botão: o .member-button foi feito para <button>. */
