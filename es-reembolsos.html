<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f7fb">
<title>Reembolsos · LATAM</title>
<!-- O painel de reembolsos do suporte (18/11/2026). Mostra e guarda os
     pedidos da /es-reembolso: o suporte devolve À MÃO na Whop ou na
     Digistore e marca aqui. Fala com a latam-reembolso (ações admin_*) e,
     para liberar ou retirar produtos, com a latam-api (as mesmas ações do
     /es-admin). Só entra quem está em latam_admins. Em português: quem usa é
     a equipe. Arquivo só da LATAM: o Brasil não carrega nada daqui. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/es/reembolsos-painel.css">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/icon-32.png">
</head>
<body>
<div class="ceu" aria-hidden="true"></div>

<!-- Entrar -->
<section class="entrar" id="tela-entrar" hidden>
  <div class="entrar-caixa vidro">
    <div class="marca"><span class="marca-ponto"></span>reembolsos<span class="marca-sufixo">.latam</span></div>
    <h1>Fila de reembolsos</h1>
    <p class="sub">Entre com o seu e-mail da equipe.</p>
    <form id="form-entrar" novalidate>
      <label class="campo">
        <span>E-mail</span>
        <input type="email" id="entrar-email" autocomplete="email" inputmode="email" placeholder="voce@exemplo.com" required>
      </label>
      <button class="botao botao-claro botao-largo" type="submit" id="entrar-botao">Entrar</button>
      <p class="aviso-erro" id="entrar-erro" role="alert" hidden></p>
    </form>
  </div>
</section>

<!-- O painel -->
<div class="painel" id="tela-painel" hidden>
  <header class="topo">
    <div class="marca"><span class="marca-ponto"></span>reembolsos<span class="marca-sufixo">.latam</span></div>
    <div class="topo-direita">
      <span class="quem" id="quem"></span>
      <a class="botao botao-fantasma botao-pequeno" href="/es-admin">Painel completo</a>
      <button class="botao botao-fantasma botao-pequeno" type="button" id="botao-atualizar" aria-label="Atualizar a lista">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        <span>Atualizar</span>
      </button>
      <button class="botao botao-fantasma botao-pequeno" type="button" id="botao-sair">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <section class="cabeca">
      <div>
        <p class="sobre">Suporte · 7 Amenes de la Madrugada</p>
        <h1>Pedidos de reembolso</h1>
        <p class="sub">Prometemos resposta em até <b>24 horas</b>. O dinheiro é devolvido à mão, na Whop ou na Digistore; aqui você guarda e acompanha.</p>
      </div>
      <button class="botao botao-claro" type="button" id="botao-novo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Novo pedido
      </button>
    </section>

    <section class="numeros" id="numeros" aria-label="Resumo"></section>

    <section class="barra">
      <div class="abas" role="tablist" id="abas"></div>
      <label class="busca">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="busca" placeholder="Buscar por e-mail, nome ou ID do pagamento" autocomplete="off">
      </label>
    </section>

    <p class="estado" id="estado" role="status">Carregando…</p>
    <section class="lista" id="lista" aria-live="polite"></section>
  </main>
</div>

<!-- O detalhe de um pedido (gaveta à direita; tela cheia no celular) -->
<div class="fundo-gaveta" id="fundo-gaveta" hidden></div>
<aside class="gaveta vidro" id="gaveta" aria-label="Detalhe do pedido" hidden>
  <div class="gaveta-topo">
    <button class="botao botao-fantasma botao-pequeno" type="button" id="fechar-gaveta">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      Fechar
    </button>
    <span class="mono apagado" id="gaveta-id"></span>
  </div>
  <div class="gaveta-corpo" id="gaveta-corpo"></div>
</aside>

<!-- Janela de confirmação e de novo pedido -->
<dialog class="janela vidro" id="janela"></dialog>

<div class="aviso-rapido" id="aviso-rapido" role="status" hidden></div>

<script src="/js/es/config.js"></script>
<script src="/js/es/reembolsos-painel.js"></script>
</body>
</html>
