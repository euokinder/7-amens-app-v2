<!-- =====================================================================
     AS 30 TARDES DA MISERICÓRDIA — a página do vídeo de cada tarde.
     Pedido do Caio em 30/10/2026: uma página só, que troca de vídeo sozinha
     a cada dia. É o entregável da live de São Judas (live-sao-judas.html,
     obrigado-30-tardes.html).

     Como ela escolhe o vídeo: a Tarde 1 é 31/10 (sábado; o Caio passou o
     começo de 30/10 para 31/10 no próprio dia 30) e cada dia abre a seguinte,
     às 15h de Brasília, até a Tarde 30, em 29/11. O dia de São Judas (28/11)
     cai na Tarde 29. Antes das
     15h fica a tarde de ontem, com o aviso de que a de hoje chega às três.
     As tardes que já passaram ficam numa lista embaixo ("ele fica esperando
     por você", promete a mensagem da Tarde 1). As que não chegaram não
     aparecem.

     O link da mensagem das 15h pode ser sempre o mesmo
     (setemadrugadas.com.br/30-tardes), ou levar o número da tarde
     (setemadrugadas.com.br/30-tardes?tarde=5): assim quem toca numa
     mensagem antiga cai naquela tarde. Tarde que ainda não chegou não abre
     pelo número: a página mostra a de hoje.

     A página é aberta, sem login, e não carrega o js/member.js: nenhuma
     chamada ao Supabase. Quem garante que só compradoras recebem o link é o
     grupo fechado do WhatsApp. É trava de experiência, não de segurança: o
     relógio é o do celular, e os IDs dos vídeos ficam à vista, aqui e no
     repositório (que é público).

     Os vídeos são da Bunny e tocam pelo js/video.js, como os das madrugadas
     (biblioteca, trava de domínio e autoplay desligado: ver
     docs/bunny-videos-de-entrega.md).

     PARA PREENCHER: o ID de cada vídeo vai no bloco window.TARDES, logo no
     começo do <body>. Cada troca nesse bloco é uma publicação (1 build na
     Netlify): o ideal é juntar vários IDs numa publicação só.
     PRÉVIA DA EQUIPE: 30-tardes?previa=1 mostra todas as tardes que já têm
     vídeo, mesmo as que não chegaram, e diz quais IDs faltam. Com
     &agora=2026-11-03T14 dá para ver a página como ela fica naquele dia e
     hora (só junto com o previa=1).
     ===================================================================== -->

<script>
(function () {
  'use strict';

  var TARDES = window.TARDES;
  var TOTAL = TARDES.lista.length;
  var params = new URLSearchParams(location.search);
  var previa = params.get('previa') === '1';

  var escapar = function (texto) {
    return String(texto).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  /* ---------- QUE DIA E QUE HORA É EM BRASÍLIA ----------
     Pelo relógio do celular, convertido para Brasília (o mesmo do
     obrigado-30-tardes.html). Na prévia, ?agora=2026-11-03T14 finge outro
     dia e hora. */
  function agoraEmBrasilia() {
    var fingido = previa && /^(\d{4}-\d{2}-\d{2})T(\d{1,2})$/.exec(params.get('agora') || '');
    if (fingido) return { dia: fingido[1], hora: parseInt(fingido[2], 10) };
    try {
      var p = {};
      new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' })
        .formatToParts(new Date())
        .forEach(function (x) { p[x.type] = x.value; });
      return { dia: p.year + '-' + p.month + '-' + p.day, hora: parseInt(p.hour, 10) };
    } catch (e) {
      // Brasília é UTC-3 o ano todo desde 2019 (sem horário de verão).
      var d = new Date(Date.now() - 3 * 3600 * 1000);
      return { dia: d.toISOString().slice(0, 10), hora: d.getUTCHours() };
    }
  }

  function dataDa(n) {
    var p = TARDES.primeira.split('-');
    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n - 1)).toISOString().slice(0, 10);
  }

  // "sexta-feira, 30 de outubro"
  function porExtenso(dia) {
    var p = dia.split('-');
    return new Intl.DateTimeFormat('pt-BR', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long' })
      .format(new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12)));
  }
  // "na sexta-feira, 30 de outubro", mas "no sábado" e "no domingo".
  function naData(dia) {
    var texto = porExtenso(dia);
    return (/^(sábado|domingo)/.test(texto) ? 'no ' : 'na ') + texto;
  }

  var agora = agoraEmBrasilia();
  function chegou(n) {
    var dia = dataDa(n);
    return agora.dia > dia || (agora.dia === dia && agora.hora >= TARDES.hora);
  }

  // A última tarde que já chegou (0 = nenhuma ainda) e a próxima.
  var ultima = 0;
  for (var n = 1; n <= TOTAL; n++) if (chegou(n)) ultima = n;
  var proxima = ultima < TOTAL ? ultima + 1 : 0;
  var proximaEhHoje = proxima > 0 && dataDa(proxima) === agora.dia;

  // O player de cada tarde, pelo js/video.js. ID vazio ou fora do formato da
  // Bunny = null (a tarde fica sem vídeo).
  var videos = {};
  var faltam = [];
  TARDES.lista.forEach(function (tarde, i) {
    var numero = i + 1;
    videos[numero] = VIDEO.escolher({
      bunny: { video: String(tarde.bunny || '').trim(), formato: TARDES.formato },
      titulo: 'Tarde ' + numero + ' · ' + tarde.tema
    });
    if (!videos[numero]) faltam.push(numero);
  });

  function aberta(numero) {
    return Boolean(videos[numero]) && (previa || numero <= ultima);
  }

  // Os links da página guardam a prévia, para a equipe navegar sem perdê-la.
  function linkDa(numero) {
    var p = new URLSearchParams();
    if (numero) p.set('tarde', numero);
    if (previa) {
      p.set('previa', '1');
      if (params.get('agora')) p.set('agora', params.get('agora'));
    }
    var busca = p.toString();
    return location.pathname + (busca ? '?' + busca : '');
  }

  // Qual tarde mostrar: a pedida no link (se já chegou e tem vídeo); senão,
  // a última que chegou.
  var pedida = parseInt(params.get('tarde'), 10);
  var escolhida = 0;
  if (pedida >= 1 && pedida <= TOTAL && aberta(pedida)) escolhida = pedida;
  else if (aberta(ultima)) escolhida = ultima;
  else if (previa) for (var m = 1; m <= TOTAL && !escolhida; m++) if (aberta(m)) escolhida = m;

  /* ---------- A FAIXA DA PRÉVIA ---------- */
  if (previa) {
    var faixa = document.getElementById('aviso-previa');
    var forte = document.createElement('strong');
    forte.textContent = 'Prévia da equipe. ';
    faixa.appendChild(forte);
    faixa.appendChild(document.createTextNode(
      'Aparecem todas as tardes que têm vídeo, mesmo as que não chegaram para as clientes. '
      + (faltam.length ? 'Faltam os vídeos das tardes: ' + faltam.join(', ') + '.' : 'Os 30 vídeos estão preenchidos.')
      + ' Dia e hora considerados: ' + porExtenso(agora.dia) + ', ' + agora.hora + 'h.'
    ));
    faixa.hidden = false;
  }

  /* ---------- A TARDE ---------- */
  var tela = document.getElementById('tela');
  var check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.2 2.2L15.5 9.5"/></svg>';

  if (escolhida) {
    var tarde = TARDES.lista[escolhida - 1];
    document.title = 'Tarde ' + escolhida + ' · 30 Tardes da Misericórdia';

    var avisoNoTopo = '';
    if (escolhida > ultima) {
      avisoNoTopo = '<div class="aviso">Prévia: esta tarde ainda não chegou para as clientes. Ela chega ' + naData(dataDa(escolhida)) + ', às ' + TARDES.hora + 'h.</div>';
    } else if (escolhida < ultima) {
      avisoNoTopo = '<div class="aviso">Esta tarde já passou, e continua aqui para você.'
        + '<a class="botao" href="' + escapar(linkDa(0)) + '">Ir para a tarde de hoje</a></div>';
    } else if (proximaEhHoje) {
      avisoNoTopo = '<div class="aviso"><strong>A Tarde ' + proxima + ' chega hoje, às três da tarde.</strong> Enquanto isso, a Tarde ' + escolhida + ' continua aqui para você.</div>';
    }

    var depois = '';
    if (escolhida === ultima && !proximaEhHoje) {
      depois = proxima
        ? '<p class="proxima">Amanhã, às três da tarde, a Tarde ' + proxima + ' chega aqui, neste mesmo link.</p>'
        : '<p class="proxima">Esta é a última das 30 tardes.</p>';
    }

    tela.innerHTML = avisoNoTopo
      + '<p class="numero">Tarde ' + escolhida + ' de ' + TOTAL + '</p>'
      + '<h1>' + escapar(tarde.tema) + '</h1>'
      + '<p class="data">' + escapar(porExtenso(dataDa(escolhida))) + '</p>'
      + '<div class="barra" aria-hidden="true"><span style="width: ' + (escolhida / TOTAL * 100).toFixed(1) + '%"></span></div>'
      + '<div class="video">' + videos[escolhida].html + '</div>'
      + '<div class="cartao">'
      +   '<h2 class="titulo-secao">Como rezar</h2>'
      +   '<ul class="passos">'
      +     '<li>' + check + '<p>Toque no vídeo para começar. Aumente o volume do celular ou use um fone de ouvido.</p></li>'
      +     '<li>' + check + '<p>Traga a sua causa no coração. É ela que você entrega a São Judas, tarde após tarde.</p></li>'
      // O player da Bunny volta SOZINHO para o ponto em que ela parou, no
      // mesmo celular (docs/bunny-videos-de-entrega.md, risco 4).
      +     '<li>' + check + '<p>Se precisar parar, pode sair. Quando voltar, o vídeo continua sozinho de onde você parou.</p></li>'
      +   '</ul>'
      + '</div>'
      + depois;
  } else if (ultima === 0) {
    var primeiraHoje = dataDa(1) === agora.dia;
    tela.innerHTML = '<div class="cartao espera">'
      + '<h1>A primeira tarde está chegando</h1>'
      + '<p>Ela chega ' + (primeiraHoje ? 'hoje' : escapar(naData(dataDa(1)))) + ', às três da tarde, aqui neste mesmo link.</p>'
      + '</div>';
  } else {
    tela.innerHTML = '<div class="cartao espera">'
      + '<h1>A Tarde ' + ultima + ' está chegando</h1>'
      + '<p>O vídeo de hoje fica pronto daqui a pouco. Volte a este mesmo link mais tarde.</p>'
      + '</div>';
  }

  /* ---------- AS TARDES ATÉ HOJE ----------
     Só as que já chegaram e têm vídeo. A que está na tela fica marcada. */
  var abertas = [];
  for (var k = 1; k <= TOTAL; k++) if (aberta(k)) abertas.push(k);

  if (abertas.length >= 2 || (abertas.length === 1 && abertas[0] !== escolhida)) {
    var seta = '<svg class="seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M10 8.5l5 3.5-5 3.5z" fill="currentColor"/></svg>';
    document.getElementById('lista').innerHTML = abertas.map(function (numero) {
      var miolo = '<span class="num">' + numero + '</span>'
        + '<span class="texto"><strong>Tarde ' + numero + '</strong>' + escapar(TARDES.lista[numero - 1].tema)
        + '<small>' + escapar(porExtenso(dataDa(numero))) + '</small></span>';
      return numero === escolhida
        ? '<li><div class="item atual" aria-current="true">' + miolo + '<span class="aqui">Você está<br>aqui</span></div></li>'
        : '<li><a class="item" href="' + escapar(linkDa(numero)) + '">' + miolo + seta + '</a></li>';
    }).join('');
    document.getElementById('lista-bloco').hidden = false;
  }
})();
</script>
