<!doctype html>
<html lang="pt-BR" class="member-checking">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cântico Angelical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=11">
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/icon-32.png">
<link rel="apple-touch-icon" href="assets/images/icon-180.png">
<link rel="stylesheet" href="css/member.css">
<script src="js/member-config.js"></script>
<script src="js/member.js"></script>
</head>
<body>
<div id="member-gate" role="status">
  <p>Verificando seu acesso…</p>
  <noscript><p>Seu navegador está com o JavaScript desligado. Ative para abrir suas orações.</p></noscript>
  <a class="member-gate-help" href="https://wa.me/5591980159224?text=Preciso%20de%20ajuda%20para%20entrar%20no%20app%207%20Am%C3%A9ns." target="_blank" rel="noopener">Precisa de ajuda? Fale com a gente</a>
</div>
<div class="app">

  <div class="header">
    <button class="back-btn" onclick="history.length > 1 ? history.back() : location.href='cantico.html'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      <span>Voltar</span>
    </button>
    <div class="avatar"><img src="assets/images/icon-96.png" alt="7 Améns da Madrugada" width="44" height="44"></div>
  </div>

  <div class="content" id="content">
    <p class="subtext">Carregando...</p>
  </div>

</div>

<script src="js/cantico.js?v=1"></script>
<script src="js/trava.js?v=2"></script>
<script>
  // cantico-dia.html?dia=1 — um dia do Cântico Angelical: o áudio, e o texto
  // quando ele chegar. O áudio tomou o lugar do vídeo, e por enquanto a entrega
  // é só o áudio (decisões do Caio, 24/09/2026). O tocador e o quadro do texto
  // são os mesmos das 7 madrugadas (dia.html) e dos Arcanjos
  // (oracao-arcanjo.html). Quem ainda não comprou, ou abriu um dia que ainda
  // não chegou, não vê esta tela: o js/member.js a troca por um aviso.
  const params = new URLSearchParams(location.search);
  const numero = params.get('dia');
  const dia = /^[0-7]$/.test(numero || '') ? CANTICO[numero] : null;
  const content = document.getElementById('content');

  // Dia sem áudio e sem texto (hoje, a Introdução) não tem o que entregar.
  if (!dia || !dia.disponivel || (!dia.audioUrl && !dia.oracao)) {
    // "Conteúdo indisponível" é também o sinal para o js/member.js não pôr o
    // botão de concluir numa página vazia.
    content.innerHTML = `
      <div class="heading-block">
        <h1 class="title" style="font-size:22px;">Conteúdo indisponível</h1>
        <p class="subtext">Não encontramos este dia. Volte para o Cântico Angelical.</p>
      </div>
      <a class="member-button" href="cantico.html" style="text-align:center;">Voltar para o Cântico</a>
    `;
  } else {
    document.title = `${dia.titulo} — Cântico Angelical`;

    // Sem audioUrl, o tocador não aparece.
    const audioHtml = dia.audioUrl
      ? `<div class="audio-card">
           <div class="audio-card-label">
             <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
             <span>Ouça o Áudio do Dia</span>
           </div>
           <div class="audio-controls">
             <button class="audio-play-btn" id="audio-play-btn" type="button" aria-label="Reproduzir">
               <svg id="audio-play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></svg>
             </button>
             <div class="audio-progress-wrap">
               <div class="audio-progress-track" id="audio-progress-track">
                 <div class="audio-progress-fill" id="audio-progress-fill"></div>
                 <div class="audio-progress-thumb" id="audio-progress-thumb"></div>
               </div>
               <div class="audio-time-row">
                 <span id="audio-time-current">0:00</span>
                 <span id="audio-time-duration">0:00</span>
               </div>
             </div>
           </div>
           <audio id="audio-el" preload="metadata" src="${dia.audioUrl}"></audio>
         </div>`
      : '';

    // Sem texto (oracao nula), a tela fica só com o áudio.
    const textoHtml = dia.oracao
      ? `<div style="display:flex;flex-direction:column;gap:14px;">
          <h2 class="section-label" style="margin:0;">A oração</h2>
          <div class="prayer-card">
            <p class="opening">${dia.oracao.abertura}</p>
            ${dia.oracao.blocos.map((bloco) => `<p>${bloco.replace(/\n/g, '<br>')}</p>`).join('')}
            <p class="closing">${dia.oracao.fechamento}</p>
          </div>
        </div>`
      : '';

    // O botão "Concluí este dia" (js/member.js) entra logo ANTES do elemento
    // marcado como member-progress-anchor: aqui, a frase do dia seguinte. Um
    // <div> vazio no lugar dela somaria mais um espaço entre os blocos. No
    // Sétimo Dia, que não tem frase, ele cai antes da faixa dourada.
    const proximoHtml = dia.proximo
      ? `<p class="subtext" id="member-progress-anchor" style="text-align:center;">${dia.proximo}</p>`
      : '';

    content.innerHTML = `
      <span class="kicker">${dia.kicker}</span>
      <div class="section-heading" style="margin-top:-8px;">
        <div class="bar"></div>
        <div class="heading-block">
          <h1 class="title" style="font-size:22px;">${dia.titulo}</h1>
          <p class="subtext">${dia.subtitulo}</p>
        </div>
      </div>

      ${audioHtml}

      ${textoHtml}

      ${proximoHtml}

      <div class="banner">
        <span>Um dia de cada vez, na ordem da jornada</span>
      </div>

      <a class="member-button" href="cantico.html" style="text-align:center;">Ver todos os dias</a>
    `;

    if (dia.audioUrl) {
      const audio = document.getElementById('audio-el');
      const playBtn = document.getElementById('audio-play-btn');
      const playIcon = document.getElementById('audio-play-icon');
      const track = document.getElementById('audio-progress-track');
      const fill = document.getElementById('audio-progress-fill');
      const thumb = document.getElementById('audio-progress-thumb');
      const currentEl = document.getElementById('audio-time-current');
      const durationEl = document.getElementById('audio-time-duration');

      const playPath = '<path d="M8 5.5v13l11-6.5-11-6.5Z"/>';
      const pausePath = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';

      const formatTime = (s) => {
        if (!isFinite(s)) return '0:00';
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60).toString().padStart(2, '0');
        return `${m}:${sec}`;
      };

      const updateProgress = () => {
        const ratio = audio.duration ? audio.currentTime / audio.duration : 0;
        fill.style.width = (ratio * 100) + '%';
        thumb.style.left = (ratio * 100) + '%';
        currentEl.textContent = formatTime(audio.currentTime);
      };

      audio.addEventListener('loadedmetadata', () => {
        durationEl.textContent = formatTime(audio.duration);
      });

      audio.addEventListener('timeupdate', updateProgress);

      audio.addEventListener('ended', () => {
        audio.currentTime = 0;
        playIcon.innerHTML = playPath;
        playBtn.setAttribute('aria-label', 'Reproduzir');
        updateProgress();
      });

      playBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play();
          playIcon.innerHTML = pausePath;
          playBtn.setAttribute('aria-label', 'Pausar');
        } else {
          audio.pause();
          playIcon.innerHTML = playPath;
          playBtn.setAttribute('aria-label', 'Reproduzir');
        }
      });

      let isDragging = false;
      const seekFromEvent = (e) => {
        const rect = track.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const ratio = Math.min(1, Math.max(0, x / rect.width));
        if (audio.duration) {
          audio.currentTime = ratio * audio.duration;
          updateProgress();
        }
      };
      track.addEventListener('pointerdown', (e) => {
        isDragging = true;
        track.setPointerCapture(e.pointerId);
        seekFromEvent(e);
      });
      track.addEventListener('pointermove', (e) => {
        if (isDragging) seekFromEvent(e);
      });
      track.addEventListener('pointerup', () => { isDragging = false; });
    }
  }
</script>
<script src="js/app.js?v=4"></script>
</body>
</html>
