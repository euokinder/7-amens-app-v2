<!doctype html>
<html lang="pt-BR" class="member-checking">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel — 7 Améns da Madrugada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=11">
<link rel="stylesheet" href="css/member.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/icon-32.png">
<script src="js/member-config.js"></script>
<script src="js/member.js"></script>
</head>
<body>
<main class="app admin-app">
  <header class="header">
    <a class="back-btn" href="index.html" aria-label="Voltar ao início">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      Início
    </a>
    <div class="avatar"><img src="assets/images/icon-96.png" alt="7 Améns da Madrugada" width="44" height="44"></div>
  </header>

  <div class="admin-content">
    <div class="admin-title-row">
      <div>
        <span class="eyebrow">Visão administrativa</span>
        <h1>Painel da V2</h1>
        <p>Acessos, perfis e desempenho do funil em um só lugar.</p>
      </div>
      <button class="admin-refresh" id="admin-refresh" type="button" aria-label="Atualizar painel">↻</button>
    </div>

    <div class="admin-status" id="admin-status" role="status">Carregando informações…</div>

    <section class="admin-dashboard" id="admin-dashboard" hidden>
      <div class="admin-kpis" aria-label="Resumo do aplicativo">
        <article class="admin-kpi"><span>Clientes</span><strong id="kpi-customers">0</strong><small>cadastradas</small></article>
        <article class="admin-kpi"><span>Com acesso</span><strong id="kpi-active">0</strong><small>ativas agora</small></article>
        <article class="admin-kpi"><span>Perfis</span><strong id="kpi-profiles">0</strong><small>respondidos</small></article>
        <article class="admin-kpi"><span>Orações</span><strong id="kpi-prayers">0</strong><small>concluídas</small></article>
      </div>

      <section class="admin-section">
        <div class="admin-section-heading">
          <div><span class="admin-kicker">Jornada comercial</span><h2>Campanhas do funil</h2></div>
          <span class="admin-count" id="campaign-count">0</span>
        </div>
        <div class="admin-campaigns" id="admin-campaigns"></div>
      </section>

      <section class="admin-section">
        <div class="admin-section-heading">
          <div><span class="admin-kicker">Público</span><h2>Clientes e perfis</h2></div>
          <span class="admin-count" id="customer-count">0</span>
        </div>
        <div class="admin-customers" id="admin-customers"></div>
      </section>
    </section>
  </div>
</main>
<script src="js/admin.js"></script>
</body>
</html>
