<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrar — 7 Amenes de la Madrugada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/es/app.css">
<link rel="icon" href="/assets/images/icon-32.png">
</head>
<body>
<!-- App em espanhol (LATAM): a entrada. CÓPIA do login.html do Brasil, em
     espanhol. Também recebe o link de entrada (/es-entrar#CÓDIGO), para quem
     não consegue digitar o e-mail. Plano e regras: docs/app-es.md -->
<main class="app member-login">
  <img class="brand" src="/assets/images/icon-180.png" alt="7 Amenes de la Madrugada" width="88" height="88">
  <h1>¡Qué bueno tenerte aquí!</h1>
  <p>Escribe el correo que usaste en la compra para acceder a tus oraciones.</p>
  <form id="form-entrar" novalidate>
    <label for="correo">Tu correo de la compra</label>
    <input id="correo" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="tunombre@email.com" required maxlength="254">
    <button class="member-button" type="submit">Entrar a mis oraciones</button>
    <p id="aviso" class="member-error" role="alert"></p>
  </form>
  <a id="boton-ayuda" class="member-button secondary" href="#" style="text-align:center;text-decoration:none;color:var(--ink);">No sé qué correo usé</a>
  <p class="es-correo-escrito es-correo-entrar">¿El botón no abre tu correo? Escríbenos a<br><strong>soporte@pkscale.com</strong></p>
  <a class="member-help" href="/es-reembolso">¿Quieres pedir un reembolso?</a>
</main>

<script src="/js/es/config.js"></script>
<script src="/js/es/sesion.js"></script>
<script src="/js/es/entrar.js"></script>
</body>
</html>
