<!doctype html>
<html lang="pt-BR" class="member-checking">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central dos Quatro Arcanjos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=14">
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/icon-32.png">
<link rel="apple-touch-icon" href="assets/images/icon-180.png">
<link rel="stylesheet" href="css/member.css">
<script src="js/member-config.js"></script>
<script src="js/member.js"></script>
</head>
<body>
<div id="member-gate" role="status">
  <p>Verificando seu acesso…</p>
  <noscript><p>Seu navegador está com o JavaScript desligado. Ative para abrir suas orações.</p></noscript>
  <a class="member-gate-help" href="https://wa.me/5591980159224?text=Preciso%20de%20ajuda%20para%20entrar%20no%20app%207%20Am%C3%A9ns." target="_blank" rel="noopener">Precisa de ajuda? Fale com a gente</a>
</div>
<div class="app">

  <div class="header">
    <button class="back-btn" id="voltar" onclick="history.length > 1 ? history.back() : location.href='arcanjos.html'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      <span>Voltar</span>
    </button>
    <div class="avatar"><img src="assets/images/icon-96.png" alt="7 Améns da Madrugada" width="44" height="44"></div>
  </div>

  <div class="content" id="content">
    <p class="subtext">Carregando...</p>
  </div>

</div>

<script src="js/arcanjos.js?v=1"></script>
<script src="js/tocador.js?v=1"></script>
<script>
  // oracao-arcanjo.html?a=miguel&o=1 — uma oração: o áudio guiado, e o texto
  // quando ele chegar. Por enquanto a entrega é só o áudio (decisão do Caio,
  // 24/09/2026). O tocador e o quadro da oração são os mesmos das 7 madrugadas
  // (dia.html).
  const params = new URLSearchParams(location.search);
  const arcanjo = arcanjoPelaChave(params.get('a'));
  const numero = parseInt(params.get('o'), 10);
  const item = arcanjo && arcanjo.oracoes[numero - 1];
  const content = document.getElementById('content');

  if (!item) {
    content.innerHTML = `
      <div class="heading-block">
        <h1 class="title" style="font-size:22px;">Conteúdo indisponível</h1>
        <p class="subtext">Não encontramos esta oração. Volte para a Central dos Quatro Arcanjos.</p>
      </div>
      <a class="member-button" href="arcanjos.html" style="text-align:center;">Voltar para a Central</a>
    `;
  } else {
    document.title = `${item.titulo} — Central dos Quatro Arcanjos`;
    const listaDoArcanjo = `arcanjo.html?a=${arcanjo.chave}`;
    document.getElementById('voltar').setAttribute('onclick', `history.length > 1 ? history.back() : location.href='${listaDoArcanjo}'`);

    const audioHtml = item.audioUrl ? TOCADOR.html(item.audioUrl, 'Ouça a Oração em Áudio') : '';

    // Sem texto (oracao nula), a tela fica só com o áudio.
    const textoHtml = item.oracao
      ? `<div style="display:flex;flex-direction:column;gap:14px;">
          <h2 class="section-label" style="margin:0;">A oração</h2>
          <div class="prayer-card">
            <p class="opening">${item.oracao.abertura}</p>
            ${item.oracao.blocos.map((bloco) => `<p>${bloco.replace(/\n/g, '<br>')}</p>`).join('')}
            <p class="closing">${item.oracao.fechamento}</p>
          </div>
        </div>`
      : '';

    content.innerHTML = `
      <span class="kicker">${tituloDoArcanjo(arcanjo)}</span>
      <div class="section-heading" style="margin-top:-8px;">
        <div class="bar"></div>
        <div class="heading-block">
          <h1 class="title" style="font-size:22px;">${item.titulo}</h1>
          <p class="subtext">${item.descricao}</p>
        </div>
      </div>

      ${audioHtml}

      ${textoHtml}

      <div class="banner">
        <span>Reze com fé e em voz alta, sempre que precisar</span>
      </div>

      <a class="member-button" href="${listaDoArcanjo}" style="text-align:center;">Ver as orações de ${arcanjo.nome}</a>
    `;

    // O tocador (recomeçar, voltar, avançar, velocidade) mora em js/tocador.js.
    if (item.audioUrl) TOCADOR.ligar(document.querySelector('.audio-card'), { titulo: item.titulo, album: 'Central dos Quatro Arcanjos' });
  }
</script>
<script src="js/app.js?v=4"></script>
</body>
</html>
